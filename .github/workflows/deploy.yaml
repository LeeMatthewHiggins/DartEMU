name: deploy

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "example/**"
      - ".github/workflows/deploy.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web
        working-directory: example
        # --pwa-strategy=none disables the service worker. The demo has no
        # offline requirement, and the offline-first worker otherwise
        # serves its own cached copies, so returning visitors would not
        # pick up a redeploy until the worker happened to update.
        run: flutter build web --wasm --release --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARTEMU_3EF91 }}
          channelId: live
          projectId: dartemu-3ef91
          entryPoint: example
