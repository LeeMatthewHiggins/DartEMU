name: dart_emu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/dart_emu.yaml"
      - "lib/**"
      - "test/**"
      - "example/lib/**"
      - "example/test/**"
      - "agentos/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dart_emu.yaml"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1
    with:
      dart_sdk: "stable"
      no_example: true
      run_bloc_lint: false
      min_coverage: 50

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@c2e27845f65775943bc310b3ab89e5c5432b8d4d # v1.19.2
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  machine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get --no-example

      - name: 🖥️ Machine tests
        run: dart test --run-skipped -t machine

  # The `fetch` shim is the guest's only route out of a browser, and it is
  # the one part of the proxy a VM test cannot execute at all.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get --no-example

      - name: 🌐 Browser tests
        run: dart test -p chrome test/net

  example-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: 📦 Install Dependencies
        working-directory: example
        run: flutter pub get

      - name: 🖱️ Example widget tests
        working-directory: example
        run: flutter test

  guest-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get --no-example

      - name: ⬇️ Fetch guest images from the release
        env:
          BASE: https://github.com/LeeMatthewHiggins/DartEMU/releases/download/v0.6.0
        run: |
          mkdir -p data/kernel data/rootfs
          curl -fsSL "$BASE/kernel-riscv64-6.12.bin.gz" | gunzip > data/kernel/kernel-riscv64-6.12.bin
          curl -fsSL "$BASE/kernel-riscv32-6.12.bin.gz" | gunzip > data/kernel/kernel-riscv32-6.12.bin
          curl -fsSL "$BASE/alpine-riscv32-rootfs.bin.gz" | gunzip > data/rootfs/alpine-riscv32-rootfs.bin

      - name: 🔏 Verify checksums
        run: |
          sha256sum -c <<'SUMS'
          f6bd6408824b0799b47a18c97d9a05f64085702ad3f40279673f5db0640415bf  data/kernel/kernel-riscv64-6.12.bin
          114f46b9c7e185d9f20db0312657956fb81fe58be3571311fecf382355ac351b  data/kernel/kernel-riscv32-6.12.bin
          03dab97e19ec4bf78d8e52e954cf35e21a6e5e5fefcaf0c71815dad70d2a6d24  data/rootfs/alpine-riscv32-rootfs.bin
          SUMS

      - name: 🐧 Guest end-to-end tests
        run: dart test --run-skipped -t sandbox

  agentos-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔨 Build the in-guest agent
        working-directory: agentos
        run: make

      - name: 🧪 AgentOS unit tests
        working-directory: agentos
        run: make test

      # The binary that ships in the image is cross-compiled and static, so
      # a change that only breaks that build would otherwise pass unnoticed.
      - name: 📦 Install the riscv64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: 🔨 Cross-compile for the guest
        working-directory: agentos
        run: make guest

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: |
          dart pub get --no-example

      - name: 🔎 Verify version
        run: dart run test --run-skipped -t version-verify
