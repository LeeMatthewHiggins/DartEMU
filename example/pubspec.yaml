name: dart_emu_example
description: Flutter terminal UI for the dart_emu RISC-V emulator.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  archive: ^4.0.0
  dart_emu:
    path: ../
  desktop_drop: ^0.5.0
  file_picker: ^9.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  xterm: ^4.0.0
  yaml: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/crt.frag
  assets:
    - assets/
  # Bundled rather than named: the web build resolves only the fonts declared
  # here, so a system font name falls back to proportional Roboto and the
  # terminal grid spaces every glyph to a cell it does not fill.
  #
  # The NL cut is the one without ligatures, which a cell-based terminal has
  # no way to render and no business joining.
  fonts:
    - family: JetBrainsMonoNL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
